[project]
name = "deck-builder"
version = "0.1.0"
description = "Generate deck assemblies and CAD drawings from TOML configuration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.4,<2",
    "pydantic>=2.12,<3",
]

[project.scripts]
deck-builder = "deck_builder.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
    "ty>=0.0.1,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ty.src]
include = ["src", "tests"]
